## What are we going to do?

- Basic and advanced data structures and algorithms

  - use them to solve interesting problems
  - decide what data structures and algorithms should be used for which problems

--

--

  - practice your coding skills in both
  - practice your debugging skills
  - practice testing skills

--

- Bugs, edge cases, errors/issues, ...

  - learn from each other

--

- Deal with frustration ...
  - of your program failing tests and being convinced that the problem is NOT with your own code

--

- Discuss problems, compare algorithms and solutions, analyze efficiency, ...

# Why are you here in APS?

__How do you plan to accomplish these goals?__

# What role should generative AI play in your learning? 

---

### What are some advantages of using it in a class (this or any other)?

--


1. **Speed and Efficiency:**
   - **Pro:** Generative AI tools can provide quick solutions to algorithmic problems, potentially saving time and helping us to see different approaches or get unstuck when we are facing challenges.

2. **Exposure to Diverse Techniques:**
   - **Pro:** AI tools might expose us to a variety of problem-solving techniques and algorithms we might not have encountered yet. This could enhance our understanding of different approaches and solutions.

3. **Supplementary Learning Resource:**
   - **Pro:** When used appropriately, AI tools can serve as supplementary resources to help us understand complex problems and learn how different algorithms are applied.



---

### What are some disadvantages of using it in a class (this or any other)?

--

1. **Hinders Skill Development:**
   - **Con:** Relying on AI-generated solutions can impede the development of critical problem-solving skills. We may miss out on 
   the deeper learning that comes from grappling with problems and developing solutions independently.

2. **Lack of Understanding:**
   - **Con:** If we use AI to generate solutions without understanding the underlying principles, we may struggle to communicate such solutions effectively or explain the reasoning during discussions or presentations.

3. **Over-reliance on Technology:**
   - **Con:** We might become over-reliant on technology for problem-solving, which could limit our ability to think critically and 
   solve problems without technological aid. This dependency can be detrimental in scenarios where AI tools are not available.

4. **Misalignment with Learning Objectives:**
   - **Con:** The use of generative AI tools may misalign with the (course's) learning objectives, which are likely focused on developing algorithmic thinking, 
   problem-solving skills, and effective communication. Relying on AI tools may detract from achieving these goals.


---

### How do you feel about students submitting assignments that were generated by an AI system and getting full score on them? 


---

# Generative AI and this class

- Use it to learn! not to quickly score points!

	- Work on your own solution/approach (or preferably come up with several) and then study solutions that are generated by an AI system. 
How do they compare? Did AI come up with some ideas that you missed, or the other way around? Are all solutions correct? Do they have similar performance? 
What are benefits and dwabacks of each? 

- __Any solution that you submit for grading should be your own (not generated by an AI, or copied from solutions found elsewhere).__


- If you get help from anybody or anything in solving the problem (be it an idea for the solution, parts of the solution, or anything 
that is not just a lookup into the documentation), then
credit your sources clearly at the top of the submitted file. </br>


--

- (During job interviews you are not likely to have access to AI tools.)

-- 


- During in-class assessments, you will not have access to AI tools.

# Online Judge (OJ)


---
## Online Judge (OJ) .big[&#x2696]

- __black-box testing__: it does not matter what the  program does and how as
long as it produces correct/expected output given some input


<center>
<a title="Blackbox" href="https://commons.wikimedia.org/wiki/File:Blackbox.svg">
<img width="400" alt="Blackbox"
   src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Blackbox.svg/330px-Blackbox.svg.png">
</a>
</center>


- an online judge (black-box tester) contains many hidden tests
(correctness of results and format matter!)

- an online judge produces instant results (the solution either
passed or failed the test)


--

- readability of the code does not matter .large[&#x1F622;] (well, at least
not for an OJ, but
writing readable code may help you in debugging the code and later
on in reviewing your own solutions; it
may also make it possible to show off your solutions or get help during office hours)

---
## Typical problems

Problem statement:
- description of the problem
- description of constraints
- description of the given input format and expected output format
- sample input and corresponding output

--

Three parts for the problem solution:
- read the input data (from standard input)
- calculate results
- output the results (to standard output)

---
## Workflow

- Read and __understand__ the problem. 

--

- Understand the given examples.

--

- Write additional tests that cover edge cases for the problem and all different categories of situations. 

--

- Think about possible solutions and pick one

--

- Analyze the solutions's correctness and efficiency (this means actually manually running 
that solution through the example input/output and your own tests) - if not correct or not
efficient go back to the previous step. 

--

- Write the solution as working code

--

- Test your code solution using the sample input/output given in the problem and your own tests.

--

- Submit your solution to the online judge

--

- If it passes, celebrate! .large[&#x1F483;]

--

- If it fails, go back to one of the previous steps depending on the reason for
failure

---
## Reasons for failure

- __Compilation errors__ - hopefully this does not happen

- __Wrong answer__ - the program completed the calculation in the given time and produced output, but the output is incorrect

- __Presentation error__ - the program completed the calculation in the given time and produced output, but the output is incorrect
(it differs from the correct output by whitespace)

- __Runtime error__ - the program did not terminate normally (crashed with an exception or segfault)

- __Time limit exceeded error__ - the program run for too long and was terminated

# Presented / Interview Problems

---
## Human Interviewer


- human interviewer is the judge: your approach to the solution, clarity of explanation,
  elegance and efficiency are all being judged

- problem may evolve as part of the discussion

- there are no hidden tests (except for whatever is in the head of the interviewer), but your solution should be able to handle edge cases and unexpected inputs

- readability of the code/algorithm does matter

<a title="Instituto Politécnico de Setúbal from Setúbal, Portugal, CC BY 2.0 &lt;https://creativecommons.org/licenses/by/2.0&gt;, via Wikimedia Commons"
href="https://commons.wikimedia.org/wiki/File:White_board_IPS.jpg">
<img width="500" style="float:right;" alt="White board IPS" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/White_board_IPS.jpg/330px-White_board_IPS.jpg"></a>


---
## Workflow


<a title="Arafat Uddin, Public domain, via Wikimedia Commons"
href="https://commons.wikimedia.org/wiki/File:Noun_Conversation_1325511.svg"><img width="256" style="float:right;" alt="Noun Conversation 1325511"
src="https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/Noun_Conversation_1325511.svg/250px-Noun_Conversation_1325511.svg.png"></a>

- You are presented with a (new) problem. It may be unclear or ambiguous.

--

- Make sure you understand the problem by asking followup questions.
Do NOT assume anything.

--

- Work through an example. This confirms your understanding of the
problem to you AND to the interviewer.

--

- Come up with a solution. First solution does not need to be
efficient, elegant, .... DO NOT WRITE CODE.
  Talk through your approach, make sure it is correct (run
through some examples and cover some edge cases),
  and analyze its performance

--

- Come up with a better solution (something faster, using less
memory, ...). Do similar analysis to the above.
  DO NOT WRITE CODE unless the interviewer asks for it.

--

- If you can, come up with even better solution ...

--

- Write the code or detailed pseudo-code for your solution.

--


.important[

Make sure that every step of this process is a dialog. Talk through your solution.
Show the interviewer how you are thinking about the problem.
]

---
## Reasons for failure

--

- Making assumptions instead of asking questions.

- Going directly into writing code without any discussion and analysis.

- Being disorganized.

- Ignoring interviewer suggestions.

- Not being confident (you supposed to answer questions, not ask them).

- Being too confident.

- Not being prepared / not knowing the answer.

- ...

## Java slow I/O

.left-column2[
- Classes/objects used for reading standard input:
    - `Scanner`
    - `BufferedReader` and `InputStreamReader`

- Classes/objects used for writing standard output (and more):
    - `PrintStream` (this is the type of `System.out`)
    - `BufferedWriter` and `OutputStreamWriter`

In both cases, the first option is slower than the second
(with `BufferedWriter` being significantly faster than the alternative).

See the code examples: [InputOutput0.java](01/InputOutput0.java),
[InputOutput1.java](01/InputOutput1.java), [InputOutput2.java](01/InputOutput2.java).
