## Balanced Binary Search Tree

- binary tree
- for each node
  - all the values in the left subtree are smaller than the value in that node
  - all the values in the right subtree are greater than the value in that node
  - (equal values should be stored in one of the subtrees, if allowed)

--

- `map`/`set`/`multiset` in C++ and  `TreeMap` / `TreeSet` in Java

  - the _map_ versions of the classes store `(key, value)` pairs
  - the _set_ versions of the classes store only keys (which have to be unique)
  - the `multiset` (only in C++) allows duplicate keys

--

- $O(log N)$ on
  - add key,
  - remove key,
  - find key ,
  - find min/max,
  - successor/predecessor key

--

- AVL tree, Red-Black tree

## Is it BST?

Approach 1: An in-order traversal.

Approach 2: Traverse tree recursively, enforcing valid min/max range bounds 
for every sub-tree.

```
IS-BST(root)
    // Determines if a binary tree rooted at root is a valid BST
    return IS-BST-VALIDATE(root, -INFINITY, INFINITY)

IS-BST-VALIDATE(x, min_val, max_val)
    if x == NULL then
        return true

    // Check if the current node's value violates the valid range
    if x.key ≤ min_val or x.key ≥ max_val then
        return false

    // Recursively validate left and right subtrees with updated bounds
    left_valid ← IS-BST-VALIDATE(x.left, min_val, x.key)
    right_valid ← IS-BST-VALIDATE(x.right, x.key, max_val)

    return left_valid and right_valid
```
Time Complexity: O(N)  - visits each node at most once.

Auxiliary Space Complexity: O(H) -  call stack space proportional to tree height (O(log N), when balances, O(N) in the worst case).
---

## Range Query $[a..b]$ 

Approach: Performs an in-order traversal pruned using BST properties. Left or right subtrees are skipped if their values cannot fall within the target range $[a..b]$.

```
PRINT-RANGE(x, a, b)
    // Outputs BST node keys in the range [a..b] in ascending order
    if x == NULL then
        return

    // Search left subtree only if current node's key is greater than lower bound a
    if x.key > a then
        PRINT-RANGE(x.left, a, b)

    // Output current node if it lies within [a..b]
    if a ≤ x.key and x.key ≤ b then
        OUTPUT(x.key)

    // Search right subtree only if current node's key is less than upper bound b
    if x.key < b then
        PRINT-RANGE(x.right, a, b)
```

Time Complexity: O(K+H) - where K is the number of keys printed in range $[a..b]$ and H is tree height.

Auxiliary Space Complexity: O(H) - call stack depth bounded by tree height.

---
## Ascending order of leaves

```
PRINT-LEAVES-ASCENDING(x)
    // Outputs leaf node keys of a BST in ascending order
    if x == NULL then
        return

    // Check if current node is a leaf
    if x.left == NULL and x.right == NULL then
        OUTPUT(x.key)
        return

    PRINT-LEAVES-ASCENDING(x.left)
    PRINT-LEAVES-ASCENDING(x.right)
```
Time Complexity: O(N) - traverses the tree nodes to locate all leaves.

Auxiliary Space Complexity: O(H) - call stack depth bounded by tree height H.

## Challenge: Preorder to Postorder, ver 1 

```
PREORDER-TO-POSTORDER-BST(P, n)
    // Converts a preorder array P of length n to postorder
    // traversal by constructing a Binary Search Tree.

    // Implement your own BST

    root ← NULL
    for i ← 0 to n - 1 do
        root ← BST-INSERT(root, P[i])

    BST-POSTORDER(root)


BST-POSTORDER(node)
    // Traverses and outputs nodes in postorder position
    if node ≠ NULL then
        BST-POSTORDER(node.left)
        BST-POSTORDER(node.right)
        OUTPUT(node.key)
```
--

This approach builds a standard non-self-balancing Binary Search Tree by sequentially inserting elements from the preorder array P, 
and then runs a postorder traversal on the resulting tree.

## Challenge: Preorder to Postorder, ver 2

```
PREORDER-TO-POSTORDER-QUADRATIC(P, left, right)
    // Outputs postorder traversal of a BST from preorder array P
    // within range bounds left to right (inclusive).
    if left > right then
        return

    val ← P[left]

    // Find index k of first element strictly greater than current root
    k ← left + 1
    while k ≤ right and P[k] < val do
        k ← k + 1

    // Process left subtree (elements from left + 1 to k - 1)
    PREORDER-TO-POSTORDER-QUADRATIC(P, left + 1, k - 1)

    // Process right subtree (elements from k to right)
    PREORDER-TO-POSTORDER-QUADRATIC(P, k, right)

    // Output current node in postorder position
    OUTPUT(val)
```
--

This approach uses the first element of each subarray as the subtree root, linearly scans to find the first larger element to split into left and right subtrees, and recursively outputs the result in postorder.

## Challenge: Preorder to Postorder, ver 3

```
PREORDER-TO-POSTORDER(P, min_val, max_val, idx)
    // Outputs the postorder traversal of a BST given its preorder 
    // array P, valid value range bounds, and tracking index object
    if idx.val ≥ P.length then
        return

    val ← P[idx.val]
    
    // Check if the current preorder element falls within valid subtree range
    if val < min_val or val > max_val then
        return

    // Advance pointer to consume this node as current subtree root
    idx.val ← idx.val + 1

    // Process left subtree (all values must be < val)
    PREORDER-TO-POSTORDER(P, min_val, val, idx)

    // Process right subtree (all values must be > val)
    PREORDER-TO-POSTORDER(P, val, max_val, idx)

    // Output current node in postorder position
    OUTPUT(val)
```

## Hash Table

- mapping from _keys_ to _values_ not sorted in any particular/predictable way

- lookups by key can be done in $O(1)$ (assuming a good hash function, but $O(N)$ worst case)

- addition / removal done in $O(1)$ (but $O(N)$ worst case)

--

- [`unordered_map`](http://www.cplusplus.com/reference/unordered_map/unordered_map/?kw=unordered_map)
in C++ () - starting in C++11 standard

- `HashMap`, `HashSet`, `HashTable` in Java

--

- challenge: depends on a well designed hash function
(and that is often tricky)

--

- Direct Addressing Table (DAT) is the simplest form of a hash
table in which _keys_ are the indexes - it is simply an array

## Snowflakes


<!-- https://dmoj.ca/problem/cco07p2 -->
You may have heard that no two snowflakes are alike. Your task is to write a program to determine whether this is really true.
Your program will read information about a collection of snowflakes, and search for a pair that may be identical.

Each snowflake has six arms. For each snowflake, your program will be provided with a measurement of the length
of each of the six arms. Any pair of snowflakes which have the same lengths of corresponding arms should be
flagged by your program as identical.

<!-- Note: The original CCO data were weak and have been augmented with some custom test cases.
Input Specification
-->
.small[
The first line of input will contain a single integer `n`, `0 < n ≤ 100000`, the number of snowflakes to follow.
This will be followed by `n` lines, each describing a snowflake.
Each snowflake will be described by a line containing six integers
(each integer is at least 0 and less than 10,000,000),
the lengths of the arms of the snowflake.
The lengths of the arms will be given in order around the snowflake (either clockwise or counterclockwise),
but they may begin with any of the six arms. For example, the same snowflake could be described as 1 2 3 4 5 6 or 4 3 2 1 6 5.
]

If all of the snowflakes are distinct, your program should print the message: "No two snowflakes are alike."

If there is a pair of possibly identical snowflakes, your program should print the message: "Twin snowflakes found."

Sample Input
```
2
1 2 3 4 5 6
4 3 2 1 6 5
```
Output for Sample Input
```
Twin snowflakes found.
```
